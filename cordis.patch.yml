# dsh-swarm-scheduler bundle patch: inserts this plugin's host row into the profile
# roster. Install with:
#
#   dsh plugin --profile web add link:<repo-path>/dsh-swarm-scheduler
#
# The id is owned by this plugin: reusing a shipped id would replace that entry.
- insert:
    - id: swarm-scheduler
      name: 'dsh-swarm-scheduler'
